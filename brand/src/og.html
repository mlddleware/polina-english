<!doctype html>
<meta charset="utf-8">
<title>Link preview</title>
<link rel="stylesheet" href="brand.css">
<!-- 1200×630 og:image: the card Telegram, WhatsApp and others show for a link to the site -->
<style>
  body { --dot-gap: 30px; --dot-r: 2.2px; position: relative; display: grid; place-content: center; justify-items: center; gap: 22px; }
  .logo { font-size: 116px; }
  .hand { font-size: 64px; margin-top: -6px; }
  .free {
    margin-top: 10px; font-weight: 700; font-size: 34px; color: #fff; background: var(--violet);
    padding: 16px 34px; border-radius: 999px; box-shadow: 0 7px 0 var(--violet-deep);
  }
  .s1 { font-size: 56px; left: 64px; top: 44px; rotate: -8deg; }
  .s2 { font-size: 52px; right: 76px; bottom: 60px; rotate: 6deg; }
  .s3 { font-size: 44px; right: 92px; top: 52px; rotate: 9deg; }
  .s4 { font-size: 44px; left: 92px; bottom: 70px; rotate: -5deg; }
</style>
<body class="board">
  <span class="sticker sticker--yellow s1">Hello!</span>
  <span class="sticker sticker--sky s3">Hi there</span>
  <div class="logo"><span class="logo__name">P.lingua</span><span class="logo__tag">School</span></div>
  <p class="hand">онлайн-школа языков</p>
  <p class="free">Первый урок бесплатно</p>
  <span class="sticker sticker--lilac s4">Speak up</span>
  <span class="sticker sticker--pink s2">Let's talk!</span>
</body>
