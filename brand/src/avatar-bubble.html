<!doctype html>
<meta charset="utf-8">
<title>Avatar: speech bubble</title>
<link rel="stylesheet" href="brand.css">
<!-- 640×640 bot photo: a violet speech-bubble sticker on the dotted board -->
<style>
  body { background: var(--board); }
  svg { display: block; width: 100%; height: 100%; }
  text { font-family: var(--f-display); }
</style>
<svg viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="2.2" fill="#C3CBD6" />
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#1F1A2E" flood-opacity=".35" />
    </filter>
  </defs>
  <rect width="640" height="640" fill="#EDF0F4" />
  <rect width="640" height="640" fill="url(#dots)" />
  <g transform="rotate(-6 320 320)">
    <!-- white sticker edge first, then the violet bubble on top: no seam at the tail -->
    <g filter="url(#shadow)" stroke="#fff" stroke-width="30" stroke-linejoin="round" fill="#fff">
      <rect x="112" y="118" width="416" height="340" rx="104" />
      <path d="M190 430 L160 540 L300 450 Z" />
    </g>
    <g fill="#8B3FDB">
      <rect x="112" y="118" width="416" height="340" rx="104" />
      <path d="M190 430 L160 540 L300 450 Z" />
    </g>
    <text x="300" y="400" font-size="300" text-anchor="middle" fill="#fff">P</text>
    <circle cx="420" cy="366" r="34" fill="#FFEC85" />
  </g>
</svg>
